name: CI/CD Pipeline

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

jobs:
  # 1. EL JOB DE TEST QUE TE TOCA A VOS (CA1)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar paquetes
        run: dotnet restore Back/Dsw2025Tpi.sln

      - name: Compilar
        run: dotnet build Back/Dsw2025Tpi.sln --configuration Release --no-restore

      - name: Ejecutar Pruebas Automatizadas
        run: dotnet test Back/Dsw2025Tpi.sln --configuration Release --no-build --verbosity normal

  # 2. EL JOB DE BUILD Y DEDEPLOY ORIGINAL DE TUS COMPAÑEROS (CON EL NEEDS)
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test # <--- ESTO ES LO ÚNICO QUE TIENEN QUE AGREGAR ACÁ (CA2)
    
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

