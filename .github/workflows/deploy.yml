name: CI/CD Pipeline

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar paquetes
        run: dotnet restore Back/Dsw2025Tpi.sln

      - name: Compilar
        run: dotnet build Back/Dsw2025Tpi.sln --configuration Release --no-restore

      - name: Ejecutar Pruebas Automatizadas
        run: dotnet test Back/Dsw2025Tpi.sln --configuration Release --no-build --verbosity normal

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir la imagen Docker
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ics-backend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ics-backend:latest \
            -f Back/Dockerfile \
            .

      - name: Subir la imagen a Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ics-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ics-backend:latest

      - name: Desplegar en Azure App Service
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ics-backend:${{ github.sha }}